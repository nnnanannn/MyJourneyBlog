<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'My Learning Journey'">My Learning Journey</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        /* Using a unique name to avoid conflicts with .container in style.css */
        .app-wrapper {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background-color: var(--beige-100);
            border-right: 1px solid var(--border);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            padding: 2rem 0;
            display: flex;
            flex-direction: column;
            z-index: 100; /* Ensure it stays on top */
        }

        .sidebar-header {
            padding: 0 1.5rem 1.5rem;
            border-bottom: 1px solid var(--beige-300);
            margin-bottom: 1.5rem;
        }

        .sidebar-header h1 {
            font-size: 1.5rem;
            color: var(--beige-800);
            margin-bottom: 0.5rem;
        }

        .sidebar-header p {
            font-size: 0.875rem;
            color: var(--beige-600);
        }

        /* User Profile Section in Sidebar */
        .sidebar-user-profile {
            padding: 0 1.5rem;
            margin-bottom: 1.5rem;
            display: none;
        }

        .sidebar-user-greeting {
            font-size: 0.875rem;
            color: var(--beige-600);
        }

        .sidebar-username {
            font-weight: 700;
            color: var(--accent);
            font-size: 1.1rem;
            word-break: break-all;
        }

        .nav-section {
            margin-bottom: 2rem;
        }

        .nav-section-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--beige-600);
            padding: 0 1.5rem;
            margin-bottom: 0.75rem;
            letter-spacing: 0.5px;
        }

        .nav-link {
            display: block;
            padding: 0.75rem 1.5rem;
            color: var(--beige-700);
            text-decoration: none;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .nav-link:hover {
            background-color: var(--beige-200);
            color: var(--beige-900);
            border-left-color: var(--accent);
        }

        .nav-link.active {
            background-color: var(--beige-200);
            color: var(--beige-900);
            border-left-color: var(--accent);
            font-weight: 500;
        }

        /* Main Content Area */
        .main-content {
            margin-left: 250px; /* Matches sidebar width */
            flex: 1;
            padding: 2rem 3rem;
            width: calc(100% - 250px); /* Ensure it takes remaining width */
        }

        .page-header {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--beige-300);
        }

        .page-header h1 {
            font-size: 2.5rem;
            color: var(--beige-900);
            margin-bottom: 0.5rem;
        }

        .page-header p {
            color: var(--beige-600);
            font-size: 1.125rem;
        }

        /* Auth buttons */
        .auth-section {
            padding: 1.5rem;
            border-top: 1px solid var(--beige-300);
            margin-top: auto;
        }

        .auth-buttons {
            display: flex;
            gap: 0.5rem;
            flex-direction: column;
        }

        #guest-nav, #user-nav {
            display: none;
        }
    </style>

    <th:block layout:fragment="extra-css"></th:block>
</head>
<body>
<div class="app-wrapper">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>My Journey</h1>
            <p>Learning Log & Projects</p>
        </div>

        <div id="sidebar-user-profile" class="sidebar-user-profile">
            <div class="sidebar-user-greeting">Signed in as:</div>
            <div id="sidebar-username" class="sidebar-username">User</div>
        </div>

        <nav>
            <div class="nav-section">
                <div class="nav-section-title">Main</div>
                <a href="/" class="nav-link">Home</a>
            </div>

            <div class="nav-section">
                <div class="nav-section-title">Learning Journey</div>
                <a href="/learning/by-date" class="nav-link">By Date</a>
            </div>

            <div class="nav-section">
                <div class="nav-section-title">Projects</div>
                <a href="/projects/by-date" class="nav-link">By Date</a>
            </div>
        </nav>

        <div class="auth-section">
            <div id="guest-nav" class="auth-buttons">
                <a href="/login" class="btn">Login</a>
                <a href="/register" class="btn btn-secondary">Register</a>
            </div>

            <div id="user-nav" class="auth-buttons">
                <a href="/dashboard" class="btn">Dashboard</a>
                <button onclick="logout()" class="btn btn-secondary" style="width: 100%">Logout</button>
            </div>
        </div>
    </aside>

    <div class="main-content">
        <div layout:fragment="content"></div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');

        const guestNav = document.getElementById('guest-nav');
        const userNav = document.getElementById('user-nav');
        const userProfile = document.getElementById('sidebar-user-profile');
        const usernameDisplay = document.getElementById('sidebar-username');

        if (token && username) {
            if(guestNav) guestNav.style.display = 'none';
            if(userNav) userNav.style.display = 'flex';

            if(usernameDisplay) usernameDisplay.textContent = username;
            if(userProfile) userProfile.style.display = 'block';
        } else {
            if(guestNav) guestNav.style.display = 'flex';
            if(userNav) userNav.style.display = 'none';
            if(userProfile) userProfile.style.display = 'none';
        }
    });

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('username');
        window.location.href = '/';
    }
</script>

<th:block layout:fragment="extra-js"></th:block>
</body>
</html>
