<body>
<nav class="navbar">
    <div class="navbar-container">
        <a href="/" class="nav-brand">MyJourneyBlog</a>

        <div class="nav-menu">
            <a href="/" class="nav-link">Home</a>
            <a href="/learning/by-date" class="nav-link">Learning</a>
            <a href="/projects" class="nav-link">Projects</a>

            <div id="guest-nav" class="auth-buttons">
                <a href="/login" class="nav-link">Sign in</a>
                <a href="/register" class="btn btn-primary">Get started</a>
            </div>

            <div id="user-nav" class="auth-buttons" style="display: none;">
                <!--<a href="/create-post" class="nav-link" title="CreatePost">
                    <span style="font-size: 1.2rem;">✍️</span> CreatePost
                </a>-->
                
                <div class="nav-user-profile">
                    <a href="/dashboard" class="nav-user-avatar" title="Dashboard">
                        <span id="nav-avatar-initial">U</span>
                    </a>
                    <span id="nav-username" style="font-weight: 500; display: none;">User</span>
                </div>
                
                <button onclick="logout()" class="nav-link" style="background: none; border: none; cursor: pointer;">
                    Sign out
                </button>
            </div>
        </div>
    </div>
</nav>

<main class="main-content">
    <div layout:fragment="content"></div>
</main>

<footer style="text-align: center; padding: 2rem; font-size: 0.875rem; color: var(--beige-600); border-top: 1px solid var(--beige-200); margin-top: auto;">
    <p>&copy; 2025 MyJourney Blog. Documenting the process.</p>
</footer>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');

        const guestNav = document.getElementById('guest-nav');
        const userNav = document.getElementById('user-nav');
        const navUsername = document.getElementById('nav-username');
        const navAvatarInit = document.getElementById('nav-avatar-initial');

        if (token && username) {
            // User is logged in
            if(guestNav) guestNav.style.display = 'none';
            if(userNav) userNav.style.display = 'flex';
            
            if(navUsername) {
                navUsername.textContent = username;
                // navUsername.style.display = 'inline'; // Uncomment if you want text name next to avatar
            }
            if(navAvatarInit) navAvatarInit.textContent = username.charAt(0).toUpperCase();
            
        } else {
            // Guest mode
            if(guestNav) guestNav.style.display = 'flex';
            if(userNav) userNav.style.display = 'none';
        }
    });

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('username');
        window.location.href = '/';
    }
</script>

<th:block layout:fragment="extra-js"></th:block>
</body>
