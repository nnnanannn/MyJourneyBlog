<!-- post-detail.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:sec="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout}">
<head>
    <title th:text="${post.title} + ' - Learning Journey'">Post - Learning Journey</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <div style="margin-bottom: 1rem;">
                <span style="background-color: var(--beige-200); padding: 0.25rem 0.75rem; border-radius: 12px; font-size: 0.875rem;"
                      th:text="${post.category}">Category</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <h1 th:text="${post.title}" style="margin-bottom: 0;">Post Title</h1>
<!--               <h1 th:text="${post.title}">Post Title</h1>-->
        </div>
        <div style="display: flex; gap: 1.5rem; color: var(--beige-600); font-size: 0.875rem;">
            <span th:text="'By ' + ${post.authorUsername}">Author</span>
        </div>
    </div>
    <div>
        <a th:href="@{/learning/post/edit/{id}(id=${post.id})}"
           sec:authorize="hasRole('ADMIN')"
           id="edit-post-btn"
           style="display: none; color: var(--accent); font-weight: bold; cursor: pointer;">
            ✏️ Edit Post
        </a>

        <button id="delete-post-btn"
                class="btn btn-secondary"
                style="display: none; color: #dc3545; font-weight: bold; cursor: pointer;"
                onclick="deletePost()">
            🗑️ Delete Post
        </button>

        <button id="detail-star-btn"
                class="btn-icon-star"
                th:data-post-id="${post.id}"
                onclick="toggleDetailStar(this)"
                title="Pin to Quick Access"
                style="display: none;"> ☆
        </button>
    </div>

    <div class="card">
<!--        <div th:if="${post.summary != null}" style="padding: 1rem; background-color: var(&#45;&#45;beige-100); border-left: 4px solid var(&#45;&#45;accent); margin-bottom: 2rem; border-radius: 6px;">-->
<!--            <h3 style="margin-bottom: 0.5rem; font-size: 1rem; font-weight: 600;">Summary</h3>-->
<!--            <p th:text="${post.summary}" style="margin: 0; color: var(&#45;&#45;beige-700);">Summary text</p>-->
<!--        </div>-->

        <div class="post-content" th:utext="${post.content}" style="line-height: 1.8;">
            Post content here...
        </div>
    </div>
    <div style="margin-top: 2rem;">
        <a href="/learning/by-date" class="btn btn-secondary">← Back to Learning Journey</a>
    </div>
</div>

<th:block layout:fragment="extra-css">
    <style>
        .post-content h1 { font-size: 2rem; margin: 1.5rem 0 1rem; }
        .post-content h2 { font-size: 1.5rem; margin: 1.5rem 0 1rem; }
        .post-content h3 { font-size: 1.25rem; margin: 1.25rem 0 0.75rem; }
        .post-content p { margin: 1rem 0; }
        .post-content ul, .post-content ol { margin: 1rem 0; padding-left: 2rem; }
        .post-content li { margin: 0.5rem 0; }
        .post-content code { background-color: var(--beige-100); padding: 0.125rem 0.25rem; border-radius: 3px; font-family: 'Courier New', monospace; }
        .post-content pre { background-color: var(--beige-100); padding: 1rem; border-radius: 6px; overflow-x: auto; }
        .post-content blockquote { border-left: 4px solid var(--beige-300); padding-left: 1rem; margin: 1rem 0; color: var(--beige-700); font-style: italic; }
        .post-content img { max-width: 100%; height: auto; border-radius: 6px; margin: 1rem 0; }
    </style>
</th:block>

<th:block layout:fragment="extra-js">
    <script>
        const token = localStorage.getItem('token');
        const postId = [[${post.id}]]; // Thymeleaf variable
        const starBtn = document.getElementById('detail-star-btn');

        document.addEventListener('DOMContentLoaded', function() {
            if (token && starBtn) {
                // 1. Show the button if admin is logged in
                starBtn.style.display = 'inline-block';

                // 2. Check if this specific post is ALREADY pinned
                checkIfPinned();
            }
        });

        async function checkIfPinned() {
            try {
                // Get list of all pinned posts
                const response = await fetch('/api/quick-access');
                if (response.ok) {
                    const pinnedPosts = await response.json();

                    // Get the ID of the current post from the button's data attribute
                    const currentPostId = parseInt(starBtn.getAttribute('data-post-id'));

                    // Check if current ID exists in the pinned list
                    const isPinned = pinnedPosts.some(p => p.id === currentPostId);

                    if (isPinned) {
                        setStarActive(starBtn);
                    } else {
                        setStarInactive(starBtn);
                    }
                }
            } catch (error) {
                console.error("Error checking pinned status", error);
            }
        }

        async function toggleDetailStar(btn) {
            if (!token) return;

            const postId = btn.getAttribute('data-post-id');

            try {
                const response = await fetch(`/api/quick-access/toggle/${postId}`, {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (response.ok) {
                    const data = await response.json();

                    // 1. Update the Star Visual
                    if (data.isSaved) {
                        setStarActive(btn);
                    } else {
                        setStarInactive(btn);
                    }

                    // 2. Trigger Navbar Update (So the dropdown updates instantly)
                    document.dispatchEvent(new Event('quickAccessUpdated'));
                }
            } catch (error) {
                console.error("Error toggling star", error);
            }
        }

        function setStarActive(btn) {
            btn.innerHTML = '★';
            btn.style.color = 'var(--accent)';
            btn.title = "Unpin from Quick Access";
        }

        function setStarInactive(btn) {
            btn.innerHTML = '☆';
            btn.style.color = 'var(--beige-400)';
            btn.title = "Pin to Quick Access";
        }

        document.addEventListener('DOMContentLoaded', function() {
            if(token) {
                document.getElementById('edit-post-btn').style.display = 'inline-block';
                document.getElementById('delete-post-btn').style.display = 'inline-block';
            }
        });

        async function deletePost() {
            if (!confirm("Are you sure you want to delete this post? This cannot be undone.")) return;

            try {
                const response = await fetch(`/api/posts/${postId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });

                if (response.ok) {
                    alert("Post deleted successfully.");
                    window.location.href = '/learning/by-date'; // Redirect to list
                } else {
                    alert("Failed to delete post.");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("An error occurred.");
            }
        }
    </script>
</th:block>
</body>
</html>
