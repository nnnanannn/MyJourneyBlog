<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Edit Post - My Learning Journey</title>
    <link href="https://cdn.jsdelivr.net/npm/suneditor@latest/dist/css/suneditor.min.css" rel="stylesheet">
    <th:block layout:fragment="extra-css">
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <h1>Edit Post</h1>
        <p>Update your learning documentation</p>
    </div>

    <div class="card" style="max-width: 900px; margin: 0 auto;">
        <form id="editPostForm">
            <input type="hidden" id="postId" th:value="${postId}">

            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Title *</label>
                <input type="text" id="title" required class="form-control">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Topic *</label>
                <input type="text" id="topic" required list="topicSuggestions" class="form-control">
                <datalist id="topicSuggestions">
                    <option value="Java"><option value="Spring Boot"><option value="Database">
                </datalist>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Learning Date *</label>
                <input type="date" id="learningDate" required class="form-control">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Content *</label>
                <textarea id="editorContent" style="width: 100%; height: 500px; display: none;"></textarea>
            </div>

            <div id="errorMessage" class="alert alert-error" style="display: none;"></div>

            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn btn-primary">Update Post</button>
                <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

<th:block layout:fragment="extra-js">
    <script src="https://cdn.jsdelivr.net/npm/suneditor@latest/dist/suneditor.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/suneditor@latest/src/lang/en.js"></script>
    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login';

        const postId = document.getElementById('postId').value;

        // Initialize SunEditor
        const editor = SUNEDITOR.create('editorContent', {
            width: '100%',
            height: '500',
            buttonList: [
                ['undo', 'redo'],
                ['font', 'fontSize', 'formatBlock'],
                ['bold', 'underline', 'italic', 'strike', 'subscript', 'superscript'],
                ['fontColor', 'hiliteColor', 'textStyle'],
                ['removeFormat'],
                ['outdent', 'indent'],
                ['align', 'horizontalRule', 'list', 'lineHeight'],
                ['table', 'link', 'image'],
                ['fullScreen', 'showBlocks', 'codeView']
            ],
            lang: SUNEDITOR_LANG['en']
        });

        // Load existing data
        async function loadPost() {
            try {
                const response = await fetch(`/api/posts/${postId}`);
                if(response.ok) {
                    const post = await response.json();
                    document.getElementById('title').value = post.title;
                    document.getElementById('topic').value = post.category;
                    if(post.learningDate) {
                        document.getElementById('learningDate').value = post.learningDate;
                    }
                    // Handle content
                    const content = post.content || '';

                    // Set content into SunEditor
                    editor.setContents(content);
                } else {
                    alert('Failed to load post');
                }
            } catch(e) { console.error(e); }
        }
        loadPost();

        document.getElementById('editPostForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('errorMessage');

            // Get content from SunEditor
            const content = editor.getContents();

            const data = {
                id: postId,
                title: document.getElementById('title').value,
                category: document.getElementById('topic').value,
                learningDate: document.getElementById('learningDate').value,
                content: content
            };

            try {
                const response = await fetch(`/api/posts/${postId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    alert('Post updated successfully!');
                    window.location.href = `/learning/post/${postId}`;
                } else {
                    errorDiv.textContent = 'Update failed';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Network error';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</th:block>
</body>
</html>
