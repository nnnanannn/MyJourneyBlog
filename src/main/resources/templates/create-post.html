<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Create Learning Post - My Learning Journey</title>
    <link href="https://cdn.jsdelivr.net/npm/suneditor@latest/dist/css/suneditor.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <h1>Create Learning Post</h1>
        <p>Document daily learning progress</p>
    </div>

    <div class="card" style="max-width: 900px; margin: 0 auto;">
        <form id="createPostForm">
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Title *</label>
                <input type="text" id="title" required
                       placeholder="What did you learn today?"
                       style="width: 100%; padding: 0.75rem; border: 1px solid var(--beige-300); border-radius: 6px; font-size: 1rem;">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Topic *</label>
                <input type="text" id="topic" required
                       placeholder="e.g., Java, System Design, Spring Boot"
                       list="topicSuggestions"
                       style="width: 100%; padding: 0.75rem; border: 1px solid var(--beige-300); border-radius: 6px; font-size: 1rem;">
                <datalist id="topicSuggestions">
                    <option value="Java">
                    <option value="System Design">
                    <option value="Spring Boot">
                    <option value="Algorithms">
                    <option value="Data Structures">
                    <option value="Database">
                    <option value="Web Development">
                </datalist>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Learning Date *</label>
                <input type="date" id="learningDate" required
                       style="width: 100%; padding: 0.75rem; border: 1px solid var(--beige-300); border-radius: 6px; font-size: 1rem;">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Content *</label>
                <textarea id="editorContent" style="width: 100%; height: 500px; display: none;"></textarea>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Summary (Optional)</label>
                <textarea id="summary" rows="3"
                          placeholder="Brief summary of what you learned..."
                          style="width: 100%; padding: 0.75rem; border: 1px solid var(--beige-300); border-radius: 6px; font-size: 1rem; font-family: inherit;"></textarea>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Post Image (Optional)</label>
                <input type="file" id="postImage" accept="image/*"
                       style="width: 100%; padding: 0.75rem; border: 1px solid var(--beige-300); border-radius: 6px;">
                <small style="color: var(--beige-600); font-size: 0.875rem;">Max size: 10MB</small>

                <div id="imagePreview" style="display: none; margin-top: 1rem;">
                    <img id="previewImg" style="max-width: 100%; max-height: 300px; border-radius: 6px; border: 2px solid var(--beige-300);">
                </div>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="display: flex; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" id="published" checked>
                    <span>Publish immediately</span>
                </label>
            </div>

            <div id="errorMessage" style="display: none; padding: 0.75rem; background-color: #fee; border: 1px solid #fcc; border-radius: 6px; margin-bottom: 1rem; color: #c00;"></div>

            <div style="display: flex; gap: 1rem;">
                <button type="submit" class="btn">Create Post</button>
                <a href="/dashboard" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

<th:block layout:fragment="extra-js">
    <script src="https://cdn.jsdelivr.net/npm/suneditor@latest/dist/suneditor.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/suneditor@latest/src/lang/en.js"></script>
    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login';
        }

        // Set today's date
        document.getElementById('learningDate').valueAsDate = new Date();

        // --- Initialize SunEditor ---
        const editor = SUNEDITOR.create('editorContent', {
            width: '100%',
            height: '500',
            buttonList: [
                ['undo', 'redo'],
                ['font', 'fontSize', 'formatBlock'],
                ['bold', 'underline', 'italic', 'strike', 'subscript', 'superscript'],
                ['fontColor', 'hiliteColor', 'textStyle'],
                ['removeFormat'],
                ['outdent', 'indent'],
                ['align', 'horizontalRule', 'list', 'lineHeight'],
                ['table', 'link', 'image'], // 'table' here gives you the Excel-like grid
                ['fullScreen', 'showBlocks', 'codeView']
            ],
            placeholder: 'Write about what you learned today...',
            lang: SUNEDITOR_LANG['en']
        });

        // Image preview logic
        document.getElementById('postImage').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('previewImg').src = e.target.result;
                    document.getElementById('imagePreview').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // Form Submission
        document.getElementById('createPostForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Get content from SunEditor
            const content = editor.getContents(); // Get HTML content
            const textContent = editor.getText(); // Get plain text for validation
            const errorDiv = document.getElementById('errorMessage');

            if (textContent.trim().length === 0 && !content.includes('<img')) {
                errorDiv.textContent = 'Content cannot be empty';
                errorDiv.style.display = 'block';
                return;
            }

            // Upload Header Image logic (Keep existing)
            let imageUrl = null;
            const imageFile = document.getElementById('postImage').files[0];

            if (imageFile) {
                const formData = new FormData();
                formData.append('file', imageFile);
                try {
                    const imgResponse = await fetch('/api/files/upload/post-image', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + token },
                        body: formData
                    });
                    if (imgResponse.ok) {
                        const imgData = await imgResponse.json();
                        imageUrl = imgData.fileUrl;
                    }
                } catch (error) {
                    console.error('Image upload error:', error);
                }
            }

            const postData = {
                title: document.getElementById('title').value,
                category: document.getElementById('topic').value,
                content: content,
                summary: document.getElementById('summary').value,
                learningDate: document.getElementById('learningDate').value,
                imageUrl: imageUrl,
                published: document.getElementById('published').checked
            };

            try {
                const response = await fetch('/api/posts', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(postData)
                });

                if (response.ok) {
                    const post = await response.json();
                    alert('Post created successfully!');
                    window.location.href = '/learning/post/' + post.id;
                } else {
                    const errJson = await response.json();
                    errorDiv.textContent = errJson.message || 'Failed to create post';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'An error occurred.';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</th:block>
</body>
</html>
