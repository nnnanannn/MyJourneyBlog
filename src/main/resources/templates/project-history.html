<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${projectName} + ' - History'">Project History</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header" th:with="latestUpdate=${(updates != null and !updates.isEmpty()) ? updates.get(0) : null}">

        <div style="margin-bottom: 1rem;">
            <a href="/projects" class="btn btn-secondary" style="font-size: 0.9rem;">← Back to Projects</a>
        </div>

        <h1 th:text="${projectName}">Project Name</h1>
        <a th:if="${latestUpdate != null and latestUpdate.githubRepoUrl != null}"
           th:href="${latestUpdate.githubRepoUrl}"
           target="_blank"
           title="View on GitHub"
           style="display: inline-flex; align-items: center; gap: 0.5rem; color: var(--beige-900); text-decoration: none; font-weight: 600; font-size: 2rem;">

            <svg height="40" width="40" viewBox="0 0 16 16" version="1.1" style="fill: currentColor;">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
            </svg>

            <span>GitHub Repository</span>
        </a>
        <p>Project History & Updates</p>

        <div style="display: flex; align-items: center; justify-content: center; gap: 1rem; margin-top: 1rem;">

            <a href="/create-project"
               id="create-project-btn"
               class="create-post-link"
               title="Create Project Update"
               style="display: none;">
                <span style="font-size: 1.2rem;">🔨</span> Create Project Update
            </a>
        </div>
    </div>

    <div th:if="${updates != null and !updates.isEmpty()}">
        <div th:each="update : ${updates}" class="card fade-in" style="margin-bottom: 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem;">
                <div>
                    <a th:href="@{/projects/update/{id}(id=${update.id})}" style="text-decoration: none; color: inherit;">
                        <h3 class="card-title" th:text="${update.title}" style="margin-bottom: 0.25rem;">Update Title</h3>
                    </a>
                    <span th:text="${#temporals.format(update.createdAt, 'MMMM dd, yyyy')}" style="font-size: 0.85rem; color: var(--beige-600);">Date</span>
                </div>

                <span th:text="${update.updateType}"
                      style="background-color: var(--beige-200); padding: 0.25rem 0.75rem; border-radius: 12px; font-size: 0.75rem;">
                    TYPE
                </span>
            </div>

            <div style="margin-top: 1rem; display: flex; justify-content: space-between; align-items: center;">

                <a th:href="@{/projects/update/{id}(id=${update.id})}"
                   style="color: var(--accent); font-weight: 500;">
                    Read full update →
                </a>

                <button class="btn-icon delete-btn"
                        style="display: none; background: none; border: none; cursor: pointer; font-size: 1.2rem; padding: 0.5rem; transition: transform 0.2s;"
                        th:onclick="'deleteUpdate(' + ${update.id} + ')'"
                        title="Delete Update"
                        onmouseover="this.style.transform='scale(1.1)'"
                        onmouseout="this.style.transform='scale(1)'">
                    🗑️
                </button>
            </div>
        </div>

        <div style="margin-top: 2rem; display: flex; gap: 1rem;">
            <a href="/projects" class="btn btn-secondary">← All Projects</a>
<!--            <a th:href="@{/projects/project/{name}(name=${update.projectName})}" class="btn btn-secondary">-->
<!--                Project Update History-->
<!--            </a>-->
        </div>

        <div class="pagination" style="display: flex; justify-content: center; gap: 1rem; margin-top: 2rem;" th:if="${totalPages > 1}">
            <a th:href="@{'/projects/project/' + ${projectName}(page=${currentPage - 1})}"
               th:if="${currentPage > 0}" class="btn btn-secondary">← Newer</a>

            <span style="align-self: center; color: var(--beige-700);">Page [[${currentPage + 1}]] of [[${totalPages}]]</span>

            <a th:href="@{'/projects/project/' + ${projectName}(page=${currentPage + 1})}"
               th:if="${currentPage < totalPages - 1}" class="btn btn-secondary">Older →</a>
        </div>
    </div>

    <div th:if="${updates == null or updates.isEmpty()}" class="card">
        <p>No updates found for this project.</p>
    </div>
</div>

<th:block layout:fragment="extra-js">
    <script>
        const token = localStorage.getItem('token');

        document.addEventListener('DOMContentLoaded', function() {
            if (token) {
                // Show all delete buttons in the list
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.style.display = 'block';
                });

                // Show the create button
                const createBtn = document.getElementById('create-project-btn');
                if(createBtn) createBtn.style.display = 'inline-flex';
            }
        });

        async function deleteUpdate(id) {
            if (!confirm("Are you sure you want to delete this update?")) return;

            try {
                const response = await fetch(`/api/projects/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (response.ok) {
                    // Reload page to reflect changes
                    window.location.reload();
                } else {
                    alert("Failed to delete update.");
                }
            } catch (error) {
                console.error(error);
                alert("Network error");
            }
        }
    </script>
</th:block>
</body>
</html>
