<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Admin Portal - Site Management</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        .ql-container {
            height: 300px;
            font-family: var(--font-sans);
            font-size: 1rem;
            background-color: white;
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
        }
        .ql-toolbar {
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <h1>Admin Portal</h1>
        <p>Manage site content and settings</p>
    </div>

    <div class="card" style="max-width: 900px; margin: 0 auto;">
        <div th:if="${param.success}" class="alert alert-success" style="margin-bottom: 1.5rem;">
            Settings updated successfully!
        </div>

        <form id="settingsForm" method="POST" action="/secure-admin-portal/update-settings">
            <h2 style="font-size: 1.5rem; margin-bottom: 1rem;">Homepage: "About This Blog"</h2>

            <div style="margin-bottom: 1.5rem;">
                <div id="editor" th:utext="${aboutContent.value}"></div>
                <input type="hidden" id="hiddenContent" name="content">
            </div>

            <div style="display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="/" class="btn btn-secondary" target="_blank">View Live Site</a>
            </div>
        </form>
    </div>

    <div style="margin-top: 3rem; text-align: center;">
        <p style="color: var(--beige-600);">Quick Links</p>
        <div style="display: flex; gap: 1rem; justify-content: center;">
            <a href="/dashboard" class="btn btn-secondary">User Dashboard</a>
            <a href="/create-post" class="btn btn-secondary">Create Post</a>
            <a href="/create-project" class="btn btn-secondary">Update Project</a>
        </div>
    </div>
</div>

<th:block layout:fragment="extra-js">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        // Initialize Quill
        var quill = new Quill('#editor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    [{ 'header': [2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['link', 'clean']
                ]
            }
        });

        // Sync Quill content to hidden input before submit
        document.getElementById('settingsForm').addEventListener('submit', function() {
            document.getElementById('hiddenContent').value = quill.root.innerHTML;
        });
    </script>
</th:block>
</body>
</html>
