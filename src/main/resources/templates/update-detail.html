<!-- update-detail.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${update.title} + ' - Developer Learning Journey'">Update - Developer Learning Journey</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <div style="margin-bottom: 1rem;">
                <span style="background-color: var(--accent); color: white; padding: 0.25rem 0.75rem; border-radius: 12px; font-size: 0.875rem;"
                      th:text="${update.projectName}">Project</span>
            <span th:if="${update.fromGithubApi}" style="margin-left: 0.5rem; background-color: var(--beige-200); padding: 0.25rem 0.75rem; border-radius: 12px; font-size: 0.875rem;">
                    GitHub Synced
                </span>
        </div>
        <h1 th:text="${update.title}">Update Title</h1>
        <div style="display: flex; gap: 1.5rem; color: var(--beige-600); font-size: 0.875rem;">
            <span th:text="${#temporals.format(update.updateDate, 'MMMM dd, yyyy')}">Date</span>
            <span th:text="${update.viewCount} + ' views'">Views</span>
            <span th:text="'By ' + ${update.author.fullName}">Author</span>
        </div>
    </div>

    <div class="card">
        <div th:if="${update.summary != null}" style="padding: 1rem; background-color: var(--beige-100); border-left: 4px solid var(--accent); margin-bottom: 2rem; border-radius: 6px;">
            <h3 style="margin-bottom: 0.5rem; font-size: 1rem; font-weight: 600;">Summary</h3>
            <p th:text="${update.summary}" style="margin: 0; color: var(--beige-700);">Summary text</p>
        </div>

        <div th:if="${update.githubRepoUrl != null or update.githubCommitUrl != null}"
             style="padding: 1rem; background-color: var(--beige-50); border: 1px solid var(--beige-300); border-radius: 6px; margin-bottom: 2rem;">
            <h3 style="margin-bottom: 0.75rem; font-size: 1rem; font-weight: 600; display: flex; align-items: center;">
                <svg style="width: 20px; height: 20px; margin-right: 0.5rem;" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                </svg>
                GitHub Links
            </h3>
            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                <a th:if="${update.githubRepoUrl != null}"
                   th:href="${update.githubRepoUrl}"
                   target="_blank"
                   style="color: var(--accent); text-decoration: none;">
                    📁 Repository →
                </a>
                <a th:if="${update.githubCommitUrl != null}"
                   th:href="${update.githubCommitUrl}"
                   target="_blank"
                   style="color: var(--accent); text-decoration: none;">
                    💾 View Commit →
                </a>
            </div>
            <p th:if="${update.githubCommitSha != null}" style="margin-top: 0.5rem; font-size: 0.875rem; color: var(--beige-600);">
                Commit SHA: <code style="background-color: white; padding: 0.25rem 0.5rem; border-radius: 3px;" th:text="${update.githubCommitSha}">sha</code>
            </p>
        </div>

        <div class="update-content" th:utext="${update.content}" style="line-height: 1.8;">
            Update content here...
        </div>
    </div>

    <div style="margin-top: 2rem; display: flex; gap: 1rem;">
        <a href="/projects/by-date" class="btn btn-secondary">← Back to Projects</a>
        <a th:href="@{/projects/project/{name}(name=${update.projectName})}" class="btn btn-secondary">
            View All <span th:text="${update.projectName}">Project</span> Updates
        </a>
    </div>
</div>

<th:block layout:fragment="extra-css">
    <style>
        .update-content h1 { font-size: 2rem; margin: 1.5rem 0 1rem; }
        .update-content h2 { font-size: 1.5rem; margin: 1.5rem 0 1rem; }
        .update-content h3 { font-size: 1.25rem; margin: 1.25rem 0 0.75rem; }
        .update-content p { margin: 1rem 0; }
        .update-content ul, .update-content ol { margin: 1rem 0; padding-left: 2rem; }
        .update-content li { margin: 0.5rem 0; }
        .update-content code { background-color: var(--beige-100); padding: 0.125rem 0.25rem; border-radius: 3px; font-family: 'Courier New', monospace; }
        .update-content pre { background-color: var(--beige-100); padding: 1rem; border-radius: 6px; overflow-x: auto; }
        .update-content blockquote { border-left: 4px solid var(--beige-300); padding-left: 1rem; margin: 1rem 0; color: var(--beige-700); font-style: italic; }
        .update-content img { max-width: 100%; height: auto; border-radius: 6px; margin: 1rem 0; }
    </style>
</th:block>
</body>
</html>
