<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${update.title} + ' - Project Update'">Update</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <div style="margin-bottom: 1rem;">
            <a th:href="@{/projects/project/{name}(name=${update.projectName})}"
               style="text-decoration: none;">
                <span class="badge badge-primary"
                      th:text="${update.projectName}">Project Name</span>
            </a>
            <span class="badge badge-secondary" style="margin-left: 0.5rem;"
                  th:text="${update.updateType}">Type</span>
            <span class="badge badge-warning" style="margin-left: 0.5rem;"
                  th:text="${update.projectStatus}">Status</span>
        </div>

        <h1 th:text="${update.title}">Update Title</h1>

        <div style="display: flex; gap: 1.5rem; color: var(--beige-600); font-size: 0.9rem;">
            <span>📅 <span th:text="${#temporals.format(update.createdAt, 'MMMM dd, yyyy')}">Date</span></span>
            <span>👤 <span th:text="${update.authorUsername}">Author</span></span>
        </div>
    </div>
    <div>
        <a th:href="@{/projects/update/edit/{id}(id=${update.id})}"
           id="edit-update-btn"
           style="display: none; color: var(--accent); font-weight: bold; cursor: pointer;">
            ✏️ Edit Content
        </a>
    </div>

    <div class="card">
        <div th:if="${update.technologiesUsed != null}" style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--beige-200); padding-bottom: 1rem;">
            <strong>Stack: </strong>
            <span th:text="${update.technologiesUsed}">Java, Spring</span>
        </div>

        <div class="update-content" th:utext="${update.description}" style="line-height: 1.8; font-size: 1.1rem;">
            Update content...
        </div>

        <div th:if="${update.githubRepoUrl != null}" style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--beige-200);">
            <a th:href="${update.githubRepoUrl}" target="_blank" class="btn btn-outline" style="font-size: 0.9rem;">
                📂 View on GitHub
            </a>
        </div>
    </div>

    <div class="card" th:if="${update.challengesFaced != null or update.lessonsLearned != null}" style="background-color: var(--beige-50);">
        <div th:if="${update.challengesFaced != null}" style="margin-bottom: 1.5rem;">
            <h3 style="font-size: 1.2rem;">🔥 Challenges Faced</h3>
            <p th:text="${update.challengesFaced}">Challenges...</p>
        </div>
        <div th:if="${update.lessonsLearned != null}">
            <h3 style="font-size: 1.2rem;">💡 Lessons Learned</h3>
            <p th:text="${update.lessonsLearned}">Lessons...</p>
        </div>
    </div>

    <div style="margin-top: 2rem; display: flex; gap: 1rem;">
        <a href="/projects" class="btn btn-secondary">← All Projects</a>
        <a th:href="@{/projects/project/{name}(name=${update.projectName})}" class="btn btn-secondary">
            Project History
        </a>

    </div>
</div>

<th:block layout:fragment="extra-css">
    <style>
        /* Basic Quill Content Styling */
        .update-content h1 { font-size: 1.8rem; margin-top: 1.5rem; }
        .update-content h2 { font-size: 1.5rem; margin-top: 1.2rem; }
        .update-content p { margin-bottom: 1rem; }
        .update-content ul, .update-content ol { padding-left: 1.5rem; margin-bottom: 1rem; }
        .update-content pre {
            background: #2d2d2d;
            color: #ccc;
            padding: 1rem;
            border-radius: 4px;
            overflow-x: auto;
        }
        .update-content img { max-width: 100%; border-radius: 4px; }
    </style>
</th:block>

<th:block layout:fragment="extra-js">
    <script>
        // Show edit button if logged in
        document.addEventListener('DOMContentLoaded', function() {
            if(localStorage.getItem('token')) {
                const btn = document.getElementById('edit-update-btn');
                if(btn) btn.style.display = 'inline-block';
            }
        });
    </script>
</th:block>
</body>
</html>
