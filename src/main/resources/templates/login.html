<!-- login.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Login - My Learning Journey</title>
</head>
<head>
    <!-- Main styles -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Home - My Learning Journey</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <h1>Login</h1>
        <p>Access your dashboard to create and manage posts</p>
    </div>

    <div class="card" style="max-width: 500px; margin: 2rem auto;">
        <form id="loginForm">
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Username</label>
                <input type="text" id="username" name="username" required
                       style="width: 100%; padding: 0.75rem; border: 1px solid var(--beige-300); border-radius: 6px; font-size: 1rem;">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Password</label>
                <input type="password" id="password" name="password" required
                       style="width: 100%; padding: 0.75rem; border: 1px solid var(--beige-300); border-radius: 6px; font-size: 1rem;">
            </div>

            <div id="errorMessage" style="display: none; padding: 0.75rem; background-color: #fee; border: 1px solid #fcc; border-radius: 6px; margin-bottom: 1rem; color: #c00;"></div>

            <button type="submit" class="btn" style="width: 100%;">Login</button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem; color: var(--beige-600);">
            Don't have an account? <a href="/register" style="color: var(--accent);">Register here</a>
        </p>
    </div>
</div>

<th:block layout:fragment="extra-js">
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);
                    window.location.href = '/dashboard';
                } else {
                    const error = await response.text(); // Could be JSON or plain text
                    try {
                         const errJson = JSON.parse(error);
                         errorDiv.textContent = errJson.message || 'Login failed';
                    } catch(e) {
                         errorDiv.textContent = 'Invalid credentials';
                    }
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                console.error(error);
                errorDiv.textContent = 'An error occurred. Please try again.';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</th:block>
</body>
</html>
