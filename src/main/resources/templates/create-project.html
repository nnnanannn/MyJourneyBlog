<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Create / Update Project - Developer Learning Journey</title>
    <link href="https://cdn.jsdelivr.net/npm/suneditor@latest/dist/css/suneditor.min.css" rel="stylesheet">
</head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <h1>Create / Update Project</h1>
        <p>Start a new project or document progress on an existing one</p>
    </div>

    <div class="card" style="max-width: 900px; margin: 0 auto;">
        <form id="createUpdateForm">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
                <div>
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Project Name *</label>
                    <input type="text" id="projectName" required
                           placeholder="e.g., Blog System"
                           list="projectSuggestions"
                           class="form-control">
                    <datalist id="projectSuggestions"></datalist>
                    <small style="color: var(--beige-600);">Existing name adds an update, new name starts a project.</small>
                </div>

                <div>
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Project Status *</label>
                    <select id="projectStatus" class="form-control">
                        <option value="IN_PROGRESS">In Progress</option>
                        <option value="PLANNING">Planning</option>
                        <option value="TESTING">Testing</option>
                        <option value="COMPLETED">Completed</option>
                        <option value="ON_HOLD">On Hold</option>
                    </select>
                </div>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Update Title *</label>
                <input type="text" id="title" required
                       placeholder="What did you accomplish? (e.g., Initial Commit, Added Auth)"
                       class="form-control">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Technologies Used</label>
                <input type="text" id="technologiesUsed"
                       placeholder="Java, Spring Boot, PostgreSQL (Comma separated)"
                       class="form-control">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Update Type</label>
                <select id="updateType" class="form-control">
                    <option value="FEATURE">New Feature</option>
                    <option value="BUG_FIX">Bug Fix</option>
                    <option value="REFACTOR">Refactoring</option>
                    <option value="DOCUMENTATION">Documentation</option>
                    <option value="DEPLOYMENT">Deployment</option>
                    <option value="LEARNING">Learning</option>
                </select>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Content *</label>
                <textarea id="editorContent" style="width: 100%; height: 300px; display: none;"></textarea>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">GitHub Repository (Optional)</label>
                <input type="url" id="githubRepoUrl"
                       placeholder="https://github.com/username/repo"
                       class="form-control">
            </div>

            <div id="errorMessage" class="alert alert-error" style="display: none;"></div>

            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn btn-primary">Save Project Update</button>
                <a href="/dashboard" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

<th:block layout:fragment="extra-js">
    <script src="https://cdn.jsdelivr.net/npm/suneditor@latest/dist/suneditor.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/suneditor@latest/src/lang/en.js"></script>
    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login';

        // --- Initialize SunEditor ---
        const editor = SUNEDITOR.create('editorContent', {
            width: '100%',
            height: '300',
            buttonList: [
                ['undo', 'redo'],
                ['font', 'fontSize', 'formatBlock'],
                ['bold', 'underline', 'italic', 'strike', 'subscript', 'superscript'],
                ['fontColor', 'hiliteColor', 'textStyle'],
                ['removeFormat'],
                ['outdent', 'indent'],
                ['align', 'horizontalRule', 'list', 'lineHeight'],
                ['table', 'link', 'image'],
                ['fullScreen', 'showBlocks', 'codeView']
            ],
            placeholder: 'Describe what you worked on, challenges faced, and solutions found...',
            lang: SUNEDITOR_LANG['en']
        });

        // Load suggestions logic (Keep existing logic)
        fetch('/api/projects').then(res => res.json()).then(data => {
            if(Array.isArray(data)){
                const names = [...new Set(data.map(u => u.projectName))];
                const datalist = document.getElementById('projectSuggestions');
                datalist.innerHTML = ''; // Clear existing
                names.forEach(name => {
                    const option = document.createElement('option');
                    option.value = name;
                    datalist.appendChild(option);
                });
            }
        }).catch(e => console.error("Could not load project names", e));

        document.getElementById('createUpdateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('errorMessage');

            // Get content from SunEditor
            const content = editor.getContents();
            const textContent = editor.getText(); // Get plain text for validation

            if (textContent.trim().length === 0 && !content.includes('<img')) {
                errorDiv.textContent = 'Content cannot be empty';
                errorDiv.style.display = 'block';
                return;
            }

            const data = {
                projectName: document.getElementById('projectName').value,
                projectStatus: document.getElementById('projectStatus').value,
                title: document.getElementById('title').value,
                description: content,
                technologiesUsed: document.getElementById('technologiesUsed').value,
                updateType: document.getElementById('updateType').value,
                githubRepoUrl: document.getElementById('githubRepoUrl').value
            };

            try {
                const response = await fetch('/api/projects', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    window.location.href = '/projects';
                }
                else {
                    try {
                        const errJson = await response.json();
                        let displayMsg = errJson.message || 'Failed to save project';

                        if (errJson.validationErrors) {
                            const details = Object.values(errJson.validationErrors).join('. ');
                            displayMsg += `: ${details}`;
                        }

                        errorDiv.textContent = displayMsg;
                    } catch (e) {
                        errorDiv.textContent = 'An unexpected server error occurred.';
                    }
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Network error occurred';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</th:block>
</body>
</html>
